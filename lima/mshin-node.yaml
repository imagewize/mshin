# Machin Shin Node — Lima template (guest name: mshin-node)
#
#   limactl create --name=mshin-node lima/mshin-node.yaml
#   limactl start mshin-node
#
# Named for its architectural role (the Node), not its OS. It was mshin-kali,
# but this guest is Debian, not Kali Linux — naming it for the OS was wrong the
# moment the OS did not match, so it now pairs with mshin-core by role. The
# production Node still runs real Kali; see docs/lima-local-dev.md.
#
# Debian 13 with the full thirteen-tool set — nmap, whois, tshark and nikto from
# Debian; hydra, sqlmap, gobuster, masscan, dirb, arping and dnsenum from Debian;
# metasploit and searchsploit from their upstream vendors — the Machin Shin MCP
# server, and the mshin-node systemd unit. See docs/lima-local-dev.md.
#
# `arch` is deliberately unset: Lima defaults to the host architecture, so this
# one file gives an Intel Mac an x86_64 guest and an Apple Silicon Mac an
# aarch64 guest. Both run the tools natively.

minimumLimaVersion: 2.0.0

base:
  - template:_images/debian-13
  - template:_default/mounts

cpus: 4
# The Node runs a Node.js process and short-lived CLI tools — no model, no
# inference — so it idles near 1GB. 4GiB leaves room for the Core guest on a
# 16GB Mac. Raise it with `limactl edit mshin-node --memory=<GiB>`.
memory: "4GiB"
disk: "50GiB"

# Nothing here runs containers; skip the nerdctl download the stock templates do.
containerd:
  system: false
  user: false

# Requires the one-time host setup described in docs/lima-local-dev.md:
#   brew install socket_vmnet
#   limactl sudoers | sudo tee /etc/sudoers.d/lima
# Gives the guest a lima0 interface with a DHCP address in 192.168.105.0/24.
networks:
  - lima: shared

# The repo is private until v1.0, so the guest cannot clone it anonymously.
# Mount your host clone instead — either uncomment and set `location` below, or
# pass it at create time without editing this file, from your clone's root:
#
#   limactl create --name=mshin-node \
#     --set ".mounts += [{\"location\":\"$PWD\",\"mountPoint\":\"/opt/mshin\",\"writable\":true}]" \
#     lima/mshin-node.yaml
#
# npm then writes node_modules back to the Mac clone (it is gitignored).
# mounts:
#   - location: "<path to your clone>"
#     mountPoint: "/opt/mshin"
#     writable: true

provision:
  # Debian ships eleven of the MCP server's thirteen tools: nmap, whois, tshark
  # from main; nikto, hydra, sqlmap, gobuster, masscan, dirb, arping and dnsenum
  # from various sources. The other two (metasploit, searchsploit) come from their
  # upstream vendors in a later block -- Kali packages them, but neither is Kali-only,
  # and neither needs Kali's repo grafted onto Debian (that part is still
  # unsupported). Keep this list, the sudoers allowlist and the unit's --tools
  # flag below in sync; see the tool-list invariant in AGENTS.md.
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if command -v nmap >/dev/null 2>&1 && command -v node >/dev/null 2>&1; then
          exit 0
      fi
      export DEBIAN_FRONTEND=noninteractive
      # Answer tshark's setuid prompt up front so apt does not block on debconf.
      echo "wireshark-common wireshark-common/install-setuid boolean false" | debconf-set-selections
      # nikto ships in Debian's non-free component, not main, so the stock cloud
      # image cannot see it. nmap, whois and tshark are all in main.
      if ! grep -q "^Components:.*non-free" /etc/apt/sources.list.d/debian.sources; then
          sed -i "s/^Components: main$/Components: main non-free/" /etc/apt/sources.list.d/debian.sources
      fi
      apt-get update
      apt-get install -y curl git nmap nikto whois tshark hydra sqlmap gobuster masscan dirb arping dnsenum
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs

  # searchsploit and metasploit, from the vendors rather than from Kali.
  # Split from the block above because metasploit is a ~400MB download: a
  # failure here should not force the base tools to be reinstalled.
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      # searchsploit is a shell script over a data repo, so the clone is the
      # install and it is arch-independent. --depth 1 keeps it to the current
      # snapshot; `searchsploit -u` updates it in place afterwards.
      if ! command -v searchsploit >/dev/null 2>&1; then
          git clone --depth 1 https://gitlab.com/exploit-database/exploitdb.git \
              /opt/exploitdb
          # tools.js looks for /usr/bin/searchsploit specifically.
          ln -sf /opt/exploitdb/searchsploit /usr/bin/searchsploit
      fi
      # Rapid7's own apt repo, which publishes amd64 and arm64, so this works on
      # both the Intel and Apple Silicon guests this template produces.
      if ! command -v msfconsole >/dev/null 2>&1; then
          curl -fsSL https://apt.metasploit.com/metasploit-framework.gpg.key \
              | gpg --dearmor -o /usr/share/keyrings/metasploit.gpg
          echo "deb [signed-by=/usr/share/keyrings/metasploit.gpg] https://apt.metasploit.com lucid main" \
              > /etc/apt/sources.list.d/metasploit.list
          apt-get update
          apt-get install -y metasploit-framework
      fi
      # First msfconsole launch runs a one-time "Initial Setup" that is slow and
      # emits interactive prompts. tools.js calls the binary through `sudo -n`,
      # so the run that matters is root's -- warm /root/.msf4 here, at provision
      # time, so the first real tool call is fast and clean instead of colliding
      # with setup. `-x exit` runs the setup then quits.
      msfconsole -q -x exit >/dev/null 2>&1 || true

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      REPO_DIR=/opt/mshin
      MARKER=servers/src/kali/index.js
      if [ ! -e "${REPO_DIR}/${MARKER}" ]; then
          # Nothing mounted there, so fall back to a clone. GIT_TERMINAL_PROMPT=0
          # turns a credential prompt into an immediate error instead of a hang.
          export GIT_TERMINAL_PROMPT=0
          if ! git clone https://github.com/imagewize/mshin.git "${REPO_DIR}"; then
              cat >&2 <<'ERR'
      [ERROR] /opt/mshin has no checkout and the clone failed.
      The repository is private until v1.0, so an anonymous clone cannot work.
      Mount your host clone into the guest instead — from the root of your clone:
        limactl delete <name>
        limactl create --name=<name> \
          --set ".mounts += [{\"location\":\"$PWD\",\"mountPoint\":\"/opt/mshin\",\"writable\":true}]" \
          lima/mshin-node.yaml
      ERR
              exit 1
          fi
      fi
      # Skip ownership fixes when the repo is a host mount — the mount owns them.
      if ! mountpoint -q "${REPO_DIR}"; then
          chown -R "{{.User}}" "${REPO_DIR}"
      fi
      sudo -u "{{.User}}" npm install --prefix "${REPO_DIR}/servers/src/kali"

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # servers/src/kali/tools.js runs every binary as `sudo -n` when the server
      # is not root, so a tool missing here fails at call time, not at startup.
      # tshark is omitted: reading user-owned PCAP files as root triggers
      # Wireshark's file-owner check, and tshark needs no privileges to read
      # capture files.
      cat >/etc/sudoers.d/mshin <<'EOF'
      {{.User}} ALL=(ALL) NOPASSWD: /usr/bin/nmap, /usr/bin/nikto, /usr/bin/whois, /usr/bin/searchsploit, /usr/bin/msfconsole, /usr/bin/hydra, /usr/bin/sqlmap, /usr/bin/gobuster, /usr/bin/masscan, /usr/bin/dirb, /usr/bin/arping, /usr/bin/dnsenum
      EOF
      chmod 440 /etc/sudoers.d/mshin
      visudo -cf /etc/sudoers.d/mshin

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      UNIT=/etc/systemd/system/mshin-node.service
      install -m 644 /opt/mshin/configs/mcp-kali.service "${UNIT}"
      # The shipped unit runs as a dedicated 'mshin' user. In a throwaway
      # guest, run as the Lima login user instead; the tool list is the same
      # six, now that the block above provides the last two.
      sed -i "s|^User=.*|User={{.User}}|" "${UNIT}"
      sed -i "s|^ReadWritePaths=.*|ReadWritePaths=/opt/mshin {{.Home}}|" "${UNIT}"
      sed -i "s|^ExecStart=.*|ExecStart=/usr/bin/node index.js --tools nmap,metasploit,searchsploit,nikto,whois,tshark,hydra,sqlmap,gobuster,masscan,dirb,arping,dnsenum|" "${UNIT}"
      systemctl daemon-reload
      systemctl enable mshin-node
      systemctl restart mshin-node

probes:
  - description: "mshin-node answering on :3000"
    script: |
      #!/bin/bash
      set -eu -o pipefail
      if ! timeout 300s bash -c "until curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; do sleep 3; done"; then
          echo >&2 "mshin-node did not come up"
          exit 1
      fi
    hint: |
      The MCP server is not answering. Inside the guest, check:
        journalctl -u mshin-node -n 50
      and /var/log/cloud-init-output.log for provisioning errors.

message: |
  The Machin Shin Node is up. Read its address on the shared network:
  ------
  limactl shell {{.Name}} -- ip -4 -br addr show lima0
  ------
  That address is <NODE_IP> in docs/lima-local-dev.md. Verify it from the Core
  guest with: curl http://<NODE_IP>:3000/health
